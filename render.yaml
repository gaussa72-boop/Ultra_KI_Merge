services:
  - type: web
    name: ultra-ki-merge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: AI_ENABLED
        value: "true"
      - key: ENABLE_WEB_SEARCH
        value: "true"
      - key: OPENAI_REASONING_EFFORT
        value: high
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_API_KEY
        sync: false
